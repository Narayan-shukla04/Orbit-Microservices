services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  auth-service:
    build:
      context: ./services/auth-service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/discord}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - IK_PUB_KEY=${IK_PUB_KEY}
      - IK_PRIV_KEY=${IK_PRIV_KEY}
      - IK_URL_END_POINT=${IK_URL_END_POINT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongo
      - redis

  guild-service:
    build:
      context: ./services/guild-service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/discord}
      - JWT_SECRET=${JWT_SECRET}
      - IK_PUB_KEY=${IK_PUB_KEY}
      - IK_PRIV_KEY=${IK_PRIV_KEY}
      - IK_URL_END_POINT=${IK_URL_END_POINT}
    depends_on:
      - mongo

  messaging-service:
    build:
      context: ./services/messaging-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - CLIENT_URL=${CLIENT_URL}
      - GUILD_SERVICE_URL=http://guild-service:3003
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/discord}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
      - redis
      - guild-service

  voice-service:
    build:
      context: ./services/voice-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    depends_on:
      - mongo

  friends-service:
    build:
      context: ./services/friends-service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - CLIENT_URL=${CLIENT_URL}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/discord}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  api-gateway:
    build:
      context: ./services/api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=${CLIENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - GUILD_SERVICE_URL=http://guild-service:3003
      - MESSAGING_SERVICE_URL=http://messaging-service:3004
      - FRIENDS_SERVICE_URL=http://friends-service:3006
      - VOICE_SERVICE_URL=http://voice-service:3005
    depends_on:
      - auth-service
      - guild-service
      - messaging-service
      - voice-service
      - friends-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:3004}
        - VITE_FRIENDS_SOCKET_URL=${VITE_FRIENDS_SOCKET_URL:-http://localhost:3006}
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - api-gateway
      - messaging-service
      - friends-service

volumes:
  mongo-data:
