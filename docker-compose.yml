services:
  zookeeper:
    container_name: zookeeper
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    container_name: kafka
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_HOST: 9092
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  redis:
    image: redis:7

    ports: ["6379:6379"]

  api-gateway:
    build: ./services/api-gateway
    command: npm start
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      GUILD_SERVICE_URL: http://guild-service:3003
      MESSAGING_SERVICE_URL: http://messaging-service:3004
    depends_on:
      - auth-service
      - guild-service
      - messaging-service
      - voice-service
    develop:
      watch:
        - action: sync
          path: ./services/api-gateway
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/api-gateway/package.json

  auth-service:
    build: ./services/auth-service
    command: npm start
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/discord
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-secret
    expose:
      - "3001"
    depends_on:
      - mongo
      - redis
    develop:
      watch:
        - action: sync
          path: ./services/auth-service
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/auth-service/package.json

  guild-service:
    build: ./services/guild-service
    command: npm start
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/discord
      JWT_SECRET: local-development-secret
    ports:
      - "3003:3003"
    expose:
      - "3003"
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: ./services/guild-service
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/guild-service/package.json
  messaging-service:
    build: ./services/messaging-service
    command: npm start
    expose:
      - "3004"
    environment:
      PORT: 3004
      GUILD_SERVICE_URL: http://guild-service:3003
      MONGO_URI: mongodb://mongo:27017/discord
      JWT_SECRET: local-development-secret
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: ./services/messaging-service
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/messaging-service/package.json
  voice-service:
    build: ./services/voice-service
    command: npm start
    expose:
      - "3005"
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: ./services/voice-service
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/voice-service/package.json

volumes:
  mongo-data:
